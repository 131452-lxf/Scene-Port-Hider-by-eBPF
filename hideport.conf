#允许UID访问受保护场景端口的包。
PKG=com.hcughhgy.hvhv

#要对环回连接探测隐藏的间隔开的TCP端口。
PORTS="8788 8765 14731 14754"

#eBPF cgroup钩子隐藏connect()探测器并保持bind()/getockname()一致。
enable_eBPF=1

#可以访问场景端口的额外UID，用空格分隔。
#通常这可以保持为空；如果场景构建有助手进程，请使用它。
没有任何其他信息.

#等待包管理器或正在运行的进程显示真正的包UID。
#/data/data owner仅在找到可信UID后用作额外UID。
wait_FOR_UID_TIMEOUT=300

#如果需要等待应用进程后再加载eBPF，请设置为1。
#UID白名单表示在应用启动前加载正常情况下是安全的。
wait_FOR_PROCESS=0
